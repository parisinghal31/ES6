<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Button</h1>
    <button onclick="changeText()">changeText</button>
    <script>
        function changeText(){
        document.querySelector("h1").innerText="changed h1 using button successfully";
        }
    </script>
</body>
</html>
